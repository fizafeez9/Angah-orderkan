<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minta Tolong Angah Orderkan</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* RESET & BASE */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
      position: relative;
      overflow-x: hidden;
      /* Gradient Latar Belakang Cyan/Biru */
      background: linear-gradient(135deg, #00d2ff 0%, #0083b0 100%);
    }

    /* CORAK GELOMBANG (WAVES) SVGs */
    .bg-wave-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1;
      opacity: 0.8;
      pointer-events: none;
    }

    .bg-wave-bottom {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 100%;
      z-index: 1;
      opacity: 0.8;
      pointer-events: none;
      transform: rotate(180deg);
    }

    /* KOTAK KAD UTAMA (GLASSMORPHISM) */
    .card-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      /* Kesan Frosted Glass */
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 32px;
      padding: 36px 24px 28px 24px;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.15),
        0 0 0 1px rgba(255, 255, 255, 0.6) inset;
      text-align: center;
    }

    /* HIASAN FLOATING ELEMEN (BEG & KOTAK HADIAH) */
    .decoration-item {
      position: absolute;
      z-index: 12;
      animation: float 4s ease-in-out infinite;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));
    }

    .bag-left {
      top: -20px;
      left: -20px;
      font-size: 50px;
    }

    .gift-right {
      top: 15%;
      right: -18px;
      font-size: 38px;
      animation-delay: 1s;
    }

    .gift-left {
      top: 35%;
      left: -20px;
      font-size: 35px;
      animation-delay: 2s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(4deg); }
    }

    /* AVATAR BAG DITENGAH */
    .avatar-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      background: #ffffff;
      border-radius: 50%;
      margin: 0 auto 16px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    /* TAJUK & TEKS */
    h1 {
      color: #0f172a;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #475569;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 24px;
      padding: 0 8px;
    }

    /* BORANG & INPUT */
    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 14px 16px;
      font-size: 15px;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      outline: none;
      background: rgba(255, 255, 255, 0.9);
      color: #0f172a;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: #0083b0;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(0, 131, 176, 0.15);
    }

    /* BUTANG TAMPAL (PURPLE GRADIENT STYLES) */
    .btn-paste {
      width: 100%;
      margin-top: 8px;
      background: linear-gradient(135deg, #8a2be2 0%, #6a0dad 100%);
      color: #ffffff;
      border: none;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(138, 43, 226, 0.3);
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn-paste:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    /* BUTANG HANTAR WHATSAPP (GLOSSY GREEN GRADIENT) */
    .btn-submit {
      width: 100%;
      margin-top: 10px;
      background: linear-gradient(180deg, #28d865 0%, #1db954 100%);
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 
        0 8px 20px rgba(29, 185, 84, 0.4),
        0 2px 0px rgba(255, 255, 255, 0.3) inset;
      transition: transform 0.1s;
    }

    .btn-submit:active {
      transform: scale(0.97);
      background: linear-gradient(180deg, #1db954 0%, #15883e 100%);
    }

    /* MESEJ KEJAYAAN */
    .success-card {
      display: none;
      background: rgba(240, 253, 244, 0.95);
      border: 2px solid #86efac;
      padding: 20px;
      border-radius: 20px;
      margin-top: 15px;
    }

    .success-card h2 {
      color: #166534;
      font-size: 18px;
      margin-bottom: 6px;
    }

    .success-card p {
      color: #15803d;
      font-size: 14px;
    }

    .btn-reset {
      margin-top: 12px;
      background: none;
      border: none;
      color: #0284c7;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- BACKGROUND WAVES -->
  <svg class="bg-wave-top" viewBox="0 0 1440 320" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path fill="#ffffff" fill-opacity="0.25" d="M0,192L48,197.3C96,203,192,213,288,192C384,171,480,117,576,112C672,107,768,149,864,165.3C960,181,1056,171,1152,149.3C1248,128,1344,96,1392,80L1440,64L1440,0L1392,0C1344,0,1248,0,1152,0C1056,0,960,0,864,0C768,0,672,0,576,0C480,0,384,0,288,0C192,0,96,0,48,0L0,0Z"></path>
  </svg>

  <svg class="bg-wave-bottom" viewBox="0 0 1440 320" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path fill="#ffffff" fill-opacity="0.2" d="M0,96L48,122.7C96,149,192,203,288,208C384,213,480,171,576,144C672,117,768,107,864,122.7C960,139,1056,181,1152,186.7C1248,192,1344,160,1392,144L1440,128L1440,0L1392,0C1344,0,1248,0,1152,0C1056,0,960,0,864,0C768,0,672,0,576,0C480,0,384,0,288,0C192,0,96,0,48,0L0,0Z"></path>
  </svg>

  <!-- KOTAK BORANG UTAMA -->
  <div class="card-container">
    
    <!-- ELEMEN HIASAN FLOATING -->
    <div class="decoration-item bag-left">🛍️</div>
    <div class="decoration-item gift-right">🎁</div>
    <div class="decoration-item gift-left">📦</div>

    <!-- AVATAR / ICON -->
    <div class="avatar-wrapper">
      🛍️
    </div>

    <!-- TAJUK -->
    <h1>Minta Tolong Angah<br>Orderkan</h1>
    <p class="subtitle">Tampal link barang TikTok kat bawah, nanti anak tolong semak & belikan ya!</p>

    <!-- FORM -->
    <form id="tiktokForm">
      
      <!-- INPUT 1: LINK TIKTOK -->
      <div class="form-group">
        <label for="linkInput">1. Link Barang TikTok:</label>
        <input type="text" id="linkInput" placeholder="https://vt.tiktok.com/..." required autocomplete="off">
        <button type="button" class="btn-paste" onclick="pasteLink()">
          📋 Tekan Sini Untuk Tampal Link
        </button>
      </div>

      <!-- INPUT 2: CATATAN -->
      <div class="form-group">
        <label for="noteInput">2. Catatan (Pilihan):</label>
        <textarea id="noteInput" rows="2" placeholder="Contoh: Nak warna merah, saiz XL"></textarea>
      </div>

      <!-- BUTANG HANTAR WHATSAPP -->
      <button type="submit" class="btn-submit">
        💬 Hantar Mesej WhatsApp
      </button>

    </form>

    <!-- MESEJ DAH HANTAR -->
    <div class="success-card" id="successMessage">
      <h2>✅ WhatsApp Telah Dibuka!</h2>
      <p>Sila tekan <b>Send</b> di aplikasi WhatsApp untuk hantar pautan ini pada anak.</p>
      <button class="btn-reset" onclick="resetForm()">Hantar barang lain pula</button>
    </div>

  </div>

  <script>
    // =======================================================
    // MASUKKAN NOMBOR TELEFON WHATSAPP KORANG DI SINI!
    // Gunakan kod negara (Contoh: '60123456789')
    // =======================================================
    const NOMBOR_WHATSAPP_ANAK = '60143616615'; 

    // 1. Fungsi Auto Paste Link dari Clipboard
    async function pasteLink() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          document.getElementById('linkInput').value = text;
        } else {
          alert("Papan keratan kosong. Sila copy link di TikTok dahulu.");
        }
      } catch (err) {
        alert("Sila tekan lama pada kotak input dan pilih 'Paste' secara manual.");
      }
    }

    // 2. Fungsi Hantar Terus ke WhatsApp
    document.getElementById('tiktokForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const link = document.getElementById('linkInput').value.trim();
      const note = document.getElementById('noteInput').value.trim() || "Tiada nota khas.";

      // Format Mesej
      const mesejText = `Salam anakku, tolong check & belikan barang TikTok ni:\n\n🔗 *Link Barang:* ${link}\n📝 *Nota/Pilihan:* ${note}`;

      // Buka Link WhatsApp Direct
      const whatsappUrl = `https://wa.me/${NOMBOR_WHATSAPP_ANAK}?text=${encodeURIComponent(mesejText)}`;
      
      window.open(whatsappUrl, '_blank');

      // Tunjukkan Mesej Kejayaan
      document.getElementById('tiktokForm').style.display = 'none';
      document.getElementById('successMessage').style.display = 'block';
    });

    // 3. Reset Form
    function resetForm() {
      document.getElementById('tiktokForm').reset();
      document.getElementById('tiktokForm').style.display = 'block';
      document.getElementById('successMessage').style.display = 'none';
    }
  </script>

</body>
</html>
